name: Validate notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the tested environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate structure, links, and credentials
        run: python scripts/validate_repository.py

      - name: Execute lectures and Python primer
        env:
          MPLBACKEND: Agg
        run: >-
          python scripts/execute_notebooks.py
          lectures/*.ipynb
          appendices/python_primer.ipynb

      - name: Validate executed notebooks
        run: python scripts/validate_repository.py --allow-regenerated-images
